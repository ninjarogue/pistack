<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">pistack request route</title>
  <desc id="desc">Route map of one request through poteto-mode: Your request, poteto-mode, Playbook, Plan and delegate, Review and verify, Validated work. A footer lists the supporting skills (how, why, unslop) and shows the stack runs on Pi.</desc>

  <rect x="0" y="0" width="1200" height="430" rx="18" fill="#f6f1e7"/>

  <text x="60" y="62" font-size="23" font-weight="700" fill="#23201c">One request, one route</text>
  <text x="60" y="88" font-size="13" fill="#736a5e">poteto-mode picks the playbook and stays on the line until the work is proven.</text>

  <!-- the route -->
  <line x1="120" y1="210" x2="1120" y2="210" stroke="#23201c" stroke-width="7" stroke-linecap="round"/>

  <!-- stations -->
  <g fill="#f6f1e7" stroke="#23201c" stroke-width="5">
    <circle cx="120" cy="210" r="12"/>
    <circle cx="320" cy="210" r="14" fill="#b3541e" stroke-width="3"/>
    <circle cx="520" cy="210" r="12"/>
    <circle cx="730" cy="210" r="12"/>
    <circle cx="940" cy="210" r="12"/>
    <circle cx="1120" cy="210" r="13" fill="#2f7d6b" stroke-width="3"/>
  </g>
  <path d="M1114,210 l4,5 l8,-9" fill="none" stroke="#f6f1e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- station names -->
  <g font-size="15" font-weight="700" fill="#23201c" text-anchor="middle">
    <text x="120" y="178">Your request</text>
    <text x="320" y="178">poteto-mode</text>
    <text x="520" y="178">Playbook</text>
    <text x="730" y="178">Plan and delegate</text>
    <text x="940" y="178">Review and verify</text>
    <text x="1120" y="178">Validated work</text>
  </g>

  <!-- station detail -->
  <g font-size="11" fill="#736a5e" text-anchor="middle">
    <text x="120" y="242">a goal, a bug, an idea</text>

    <text x="320" y="242">routes to a playbook</text>
    <text x="320" y="258">or designs one &#8212; figure-it-out</text>

    <text x="520" y="242">23 in the stack</text>
    <text x="520" y="258">bugs &#183; features &#183; refactors &#183; ships</text>

    <text x="730" y="242">architect &#183; arena &#183; swarm</text>
    <text x="730" y="258">when the runtime can delegate</text>

    <text x="940" y="242">interrogate &#183; tests &#183; measure</text>
    <text x="940" y="258">prove it, don&#8217;t assume</text>

    <text x="1120" y="242">finished, shown to work</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="306" x2="1140" y2="306" stroke="#23201c" stroke-opacity="0.15" stroke-width="1"/>

  <text x="60" y="340" font-size="10" font-weight="600" letter-spacing="2" fill="#736a5e">SUPPORTING SKILLS</text>

  <g font-size="13" fill="#23201c" text-anchor="middle">
    <rect x="60"  y="352" width="64" height="32" rx="16" fill="#ece4d3" stroke="#d9cfba"/>
    <text x="92"  y="373">how</text>
    <rect x="134" y="352" width="64" height="32" rx="16" fill="#ece4d3" stroke="#d9cfba"/>
    <text x="166" y="373">why</text>
    <rect x="208" y="352" width="88" height="32" rx="16" fill="#ece4d3" stroke="#d9cfba"/>
    <text x="252" y="373">unslop</text>

    <!-- built for Pi -->
    <rect x="980" y="352" width="160" height="32" rx="16" fill="#ece4d3" stroke="#23201c" stroke-width="1.8"/>
    <text x="1060" y="373" font-weight="700">Runs on Pi</text>
  </g>
</svg>
